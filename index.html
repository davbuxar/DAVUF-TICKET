<style>
:root{--bg:#eef2ff;--card:#fff;--tx:#1e293b;--mut:#64748b;--p:#4f46e5;--p2:#ec4899;--bd:#e2e8f0;--sh:0 8px 28px rgba(79,70,229,.12)}
[data-t=dark]{--bg:#0b1020;--card:#151b30;--tx:#e8ecf8;--mut:#94a3b8;--bd:#273153;--sh:0 8px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden;background:linear-gradient(135deg,#312e81,#6d28d9,#be185d,#0e7490);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
.blob{pointer-events:none;position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;animation:fl 9s ease-in-out infinite}
.blob:nth-child(1){width:260px;height:260px;background:#fbbf24;top:-60px;left:-60px}
.blob:nth-child(2){width:300px;height:300px;background:#22d3ee;bottom:-90px;right:-70px;animation-delay:-4s}
@keyframes fl{50%{transform:translate(30px,40px) scale(1.15)}}
.lcard{position:relative;width:100%;max-width:400px;padding:30px 26px;border-radius:26px;background:rgba(255,255,255,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.35);box-shadow:0 20px 60px rgba(0,0,0,.3);color:#fff;text-align:center;animation:pop .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.94)}}
.lcard img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:50%;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:fl 6s ease-in-out infinite}
.lcard h1{font-size:22px;margin:14px 0 2px;font-weight:700}
.lcard p{opacity:.85;font-size:13px;margin-bottom:20px}
.lcard label{display:block;text-align:left;font-size:12px;margin:12px 0 5px;opacity:.9}
.lcard select,.lcard input{width:100%;padding:13px 14px;border-radius:14px;border:2px solid transparent;background:rgba(255,255,255,.95);color:#1e293b;outline:0;transition:.2s}
.lcard select:focus,.lcard input:focus{border-color:#fbbf24;box-shadow:0 0 0 4px rgba(251,191,36,.3)}
.lcard input,.lcard select{-webkit-text-fill-color:#1e293b;caret-color:#4f46e5;-webkit-user-select:text;user-select:text;position:relative;z-index:2;font-size:16px}.lcard #pin{-webkit-text-security:disc;padding-right:46px}.lcard #pin.show{-webkit-text-security:none}.pw{position:relative}.pw span{z-index:3;padding:6px;position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#475569}
.err{background:rgba(239,68,68,.9);padding:8px;border-radius:10px;margin-top:12px;font-size:12px}
.btn{border:0;cursor:pointer;padding:12px 20px;border-radius:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 6px 18px rgba(79,70,229,.35);transition:.2s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.big{width:100%;margin-top:20px;padding:14px;font-size:15px}
.btn.alt{background:linear-gradient(135deg,#0891b2,#10b981)}
.btn.ghost{background:var(--card);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
.btn.ld{opacity:.7;pointer-events:none}.btn.ld::after{content:"";width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.demo{margin-top:14px;font-size:11px;opacity:.85}
/* app shell */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff;background:linear-gradient(120deg,#3730a3,#7c3aed,#db2777)}
header img{width:38px;height:38px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}
header .who{flex:1;min-width:0;line-height:1.25}
header b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.85;font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:16px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(0,0,0,.08)}

nav button i{display:block;font-style:normal;font-size:20px;transition:.25s}
nav button.on{color:var(--p)}nav button.on i{transform:translateY(-3px) scale(1.2)}
main{max-width:1100px;margin:auto;padding:14px 12px calc(86px + env(safe-area-inset-bottom))}

@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid var(--bd)}
.card h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.k{border-radius:18px;padding:14px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh)}
.k::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.18)}
.k small{opacity:.9;font-size:11px}.k b{display:block;font-size:24px;margin-top:2px}
.k1{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.k2{background:linear-gradient(135deg,#10b981,#06b6d4)}
.k3{background:linear-gradient(135deg,#f59e0b,#ef4444)}.k4{background:linear-gradient(135deg,#ec4899,#f43f5e)}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}

table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:100%}
th{background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;padding:10px 6px;font-weight:600;white-space:nowrap}
td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd)}

.c-d{background:rgba(14,165,233,.13)}.c-r{background:rgba(16,185,129,.16);font-weight:600}

.neg{color:#ef4444!important;background:rgba(239,68,68,.2)!important}

td select{border-color:rgba(139,92,246,.5);min-width:96px}
.x{border:0;background:rgba(239,68,68,.15);color:#ef4444;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px}
.meta{font-size:11.5px;color:var(--mut);margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1;min-width:130px}
.top{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;margin-bottom:8px;background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(236,72,153,.1));border:1px solid var(--bd);animation:in .5s both}
.top .tr{font-size:26px}.top div{flex:1;min-width:0}.top b{display:block;font-size:13px}.top small{color:var(--mut);font-size:11px}
.top .n{font-weight:700;font-size:18px;color:var(--p);text-align:right;line-height:1.1}.top .n small{display:block}
.cg{display:grid;gap:14px}
.cv{position:relative;height:250px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,40px);opacity:0;z-index:50;padding:11px 18px;border-radius:30px;color:#fff;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:.35s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.ok{background:#059669}#toast.er{background:#dc2626}
.empty{padding:24px;text-align:center;color:var(--mut)}
@media(min-width:760px){
 .kpis{grid-template-columns:repeat(4,1fr)}.cg{grid-template-columns:1fr 1fr}
 nav{position:static;box-shadow:none;border:0;background:none;max-width:1100px;margin:10px auto 0;padding:0 12px;gap:8px}
 nav button{background:var(--card);border-radius:14px;border:1px solid var(--bd);display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px}
 nav button i{font-size:16px}nav button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
 main{padding-bottom:30px}#toast{bottom:30px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#wait,#okm{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(15,10,50,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#wait.on,#okm.on{display:grid;animation:fi .25s}
@keyframes fi{from{opacity:0}}
.wb{background:var(--card);border-radius:26px;padding:28px 34px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45);max-width:88%;animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
.ring{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;border:6px solid transparent;border-top-color:#6366f1;border-right-color:#ec4899;border-bottom-color:#fbbf24;animation:sp .9s linear infinite}
.wb b{display:block;font-size:16px}.wb small{color:var(--mut)}
.dots::after{content:"";animation:dt 1.2s steps(4) infinite}@keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.tick{width:92px;height:92px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#10b981,#06b6d4);display:grid;place-items:center;box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:pl 1.2s ease-out .3s 2}
@keyframes pl{to{box-shadow:0 0 0 26px rgba(16,185,129,0)}}
.tick svg{width:52px;height:52px}.tick path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:ck .6s ease .25s forwards}
@keyframes ck{to{stroke-dashoffset:0}}
.wb h3{font-size:20px;margin-bottom:4px}.wb p{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:101;animation:cf 1.8s ease-in forwards;pointer-events:none}
@keyframes cf{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.schc{font-weight:600;min-width:110px;max-width:150px;vertical-align:middle;text-align:left;background:#e0f2fe}[data-t=dark] .schc{background:#12324a}
body{background:radial-gradient(900px 400px at 0 0,rgba(99,102,241,.16),transparent),radial-gradient(800px 400px at 100% 20%,rgba(236,72,153,.12),transparent),var(--bg);background-attachment:fixed}
.hero{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:#fff;padding:18px;border-radius:22px;margin-bottom:12px;background:linear-gradient(120deg,#4338ca,#7c3aed,#db2777);box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero h2{font-size:18px}.hero p{opacity:.9;font-size:12px}.hs{font-size:11px;opacity:.95;z-index:1}.hs b{display:block;font-size:13px}
.dcard{padding:0!important;overflow:hidden}.dcard .tw{border:0;border-radius:0}
.dban{color:#fff;font-weight:700;padding:12px 16px;font-size:15px;letter-spacing:.2px}
.st th{background:rgba(79,70,229,.9);font-size:12px}.st td{padding:9px 6px}.st tbody tr:hover td{filter:brightness(.97)}
.dtc{font-weight:700;font-size:13px;writing-mode:horizontal-tb;min-width:78px}
.st .inp{font-size:16px;font-weight:700;padding:10px 4px;border-radius:12px;border-width:2px}
.st .inp:disabled{opacity:.4}
.sub td{font-weight:700;background:linear-gradient(90deg,rgba(79,70,229,.18),rgba(236,72,153,.14))!important}
.shake{animation:sk .4s;border-color:#ef4444!important}@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.sbar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:20px;background:var(--card);border:1px solid var(--bd);box-shadow:0 10px 30px rgba(79,70,229,.25)}
.gtt{font-size:12px;color:var(--mut)}.gtt b{color:var(--p);font-size:17px;margin-left:4px}.gtt span{margin-left:12px}
@media(min-width:760px){.sbar{bottom:14px}}
.shc{font-weight:700;font-size:12px;white-space:nowrap}.dban{cursor:pointer;user-select:none}.pill{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#ec4899)}.lockb{border-left:6px solid #ef4444}.openb{border-left:6px solid #10b981}.lockb .pill{background:#ef4444}nav button{font-size:10.5px}.exg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn.xl{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 6px 18px rgba(5,150,105,.35)}.btn.pdf{background:linear-gradient(135deg,#dc2626,#f97316);box-shadow:0 6px 18px rgba(220,38,38,.3)}@media(max-width:420px){.exg{grid-template-columns:1fr}}.sc{border-radius:18px;overflow:hidden;border:1px solid var(--bd);margin-bottom:14px;background:var(--card);box-shadow:var(--sh)}
.sch{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:linear-gradient(120deg,#4338ca,#7c3aed,#db2777)}
.sch .no{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:700}
.si{flex:1;min-width:0}.si b{display:block;font-size:14px}.si small{display:block;opacity:.92;font-size:11px}.sch .pill{background:rgba(255,255,255,.22)}
.upd{font-size:9px;color:var(--mut);padding:5px 14px 4px;text-align:right;font-style:italic}
.rt th{font-size:11px;padding:8px 5px}.rt th small{font-weight:400;opacity:.9;font-size:9px}.rt td{padding:6px 5px;white-space:nowrap}
.rv{color:#059669;font-weight:700}.sv{color:#d97706;font-weight:700}.sl{color:var(--mut);margin:0 3px}#sm{position:fixed;inset:0;z-index:90;display:none;background:rgba(15,10,50,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:auto;overscroll-behavior:contain}#sm.on{display:block;animation:fi .25s}
.sbox{background:var(--bg);max-width:1150px;margin:18px auto;border-radius:26px;padding:14px;min-height:60vh;animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;padding:16px;border-radius:20px;color:#fff;background:linear-gradient(120deg,#4338ca,#7c3aed,#db2777)}.mh h2{font-size:17px}.mh small{opacity:.92;font-size:11.5px}
.slink{cursor:pointer;color:var(--p);text-decoration:underline dotted;text-underline-offset:3px}.slink:hover{filter:brightness(1.2)}
@media(max-width:700px){.sbox{margin:0;border-radius:0;min-height:100vh}}
.sch .slink,.sch b{color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,.35)}.sch .si b{font-size:15px}.rs2{display:flex;flex-direction:column;gap:1px;align-items:flex-start;padding-left:6px;font-size:11px;line-height:1.35;white-space:nowrap}.rt td .rs2 .rv,.rt td .rs2 .sv{font-weight:700}</style>
</head>
<body>

<section id="login" class="login">
 <div class="blob"></div><div class="blob"></div>
 <div class="lcard">
  <img src="https://davrecruit.davcmc.in/CBT/logo.png" alt="DAV logo">
  <h1>Ticket Stock Manager</h1><p>Sign in to record and track event ticket sales</p>
  <label>User name</label>
  <select id="uSel"><option>Loading users…</option></select>
  <label>PIN</label>
  <div class="pw"><input id="pin" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter your PIN"><span id="eye">👁</span></div>
  <div id="lerr" class="err" hidden></div>
  <button id="lbtn" class="btn big">Sign in</button>
  <div id="demoNote" class="demo" hidden>Demo mode: set API_URL in index.html to use your Google Sheet.<br>Try Rajesh Kumar / 1234 or Admin / 0000</div>
 </div>
</section>

<div id="app" hidden>
 <header>
  <img src="https://davrecruit.davcmc.in/CBT/logo.png" alt="">
  <div class="who"><b id="hName"></b><small id="hSchool"></small></div>
  <button class="ib" id="rf" title="Refresh">⟳</button>
  <button class="ib" id="th" title="Dark mode">🌓</button>
  <button class="ib" id="lo" title="Sign out">⏻</button>
 </header>
 <nav id="nav">
  <button data-t="dash" class="on"><i>📊</i>Dashboard</button>
  <button data-t="alloc"><i>📦</i>Stock</button>
  <button data-t="sales"><i>🎟️</i>Ticket sales</button>
  <button data-t="teach"><i>👩‍🏫</i>Teacher sales</button>
 </nav>
 <main id="view"></main>
</div>
<div id="wait"><div class="wb"><div class="ring"></div><b id="wm" class="dots">Please wait</b><small>Talking to Google Sheet</small></div></div>
<div id="okm"><div class="wb"><div class="tick"><svg viewBox="0 0 52 52"><path d="M14 27l8 8 16-17"/></svg></div><h3 id="okt">Saved!</h3><p id="okp"></p><button class="btn" id="okb">Done</button></div></div>
<div id="sm"><div class="sbox" id="smb"></div></div>
<div id="toast"></div>

<script>
/* ====== SETTINGS ====== */
const API_URL = ("https://script.google.com/macros/s/AKfycbx2y9l5_2qzMd7l-ljD5zu7kabFpvpzhxEFIpMooUwYbZypOCDT2s5mstm7liB96hk/exec".match(/https:\/\/script\.google\.com\/macros\/s\/[^\/\s"]+\/exec/) || [""])[0];   // paste your Web App URL between the quotes
const DEMO = !API_URL;
/* ====================== */
const $ = s => document.querySelector(s);
const num = v => +v || 0;
const INR = n => '₹' + num(n).toLocaleString('en-IN');
const CC = {Silver:'#64748b', Gold:'#d97706', Platinum:'#7c3aed', Diamond:'#0891b2'};
const col = c => CC[c] || '#4f46e5';
const chip = c => `<span class="chip" style="background:${col(c)}">${c}</span>`;
let S = {}, T = [], tab = 'dash', charts = [];

/* ---------- API (Google Sheet) + demo fallback ---------- */
async function api(action, p = {}) {
  if (DEMO) return mock(action, p);
  try {
    const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, ...p})});
    const t = await r.text();
    try { return JSON.parse(t); } catch (x) { return {ok:false, error:'Script did not return data. Set access to "Anyone" and redeploy. (' + t.slice(0, 60).replace(/<[^>]*>/g, '') + ')'}; }
  } catch (e) { return {ok:false, error:'Cannot reach script (' + e.message + '). Redeploy with access = Anyone.'}; }
}
function mock(a, p) {
  let D = JSON.parse(localStorage.getItem('demoDB') || 'null');
  if (!D || !D.cfg.shifts) {
    const cats = [['Silver',600],['Gold',825],['Platinum',1000],['Diamond',1175]];
    D = {users:[{name:'Rajesh Kumar',pin:'1234',school:'DAV Public School, Patna',role:'User'},{name:'Sunita Devi',pin:'1234',school:'DAV Gandhi Maidan',role:'User'},{name:'Admin',pin:'0000',school:'',role:'Admin'}],
      cfg:{categories:cats.map(c=>({category:c[0],price:c[1]})),dates:['28-11-2026','29-11-2026','30-11-2026'],shifts:['Shift-1','Shift-2','Shift-3','Shift-4'],designations:['Principal','Vice Principal','PGT','TGT','PRT','Clerk']},
      alloc:[],sales:[],teachers:[]};

/* ---------- helpers ---------- */
function toast(m, ok = true) { const t = $('#toast'); t.textContent = m; t.className = 'show ' + (ok ? 'ok' : 'er'); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 3200); }
const wait = (on, m) => { $('#wm').textContent = m || 'Please wait'; $('#wait').classList.toggle('on', on); };
function done(t, p) {
  $('#okt').textContent = t; $('#okp').textContent = p || ''; $('#okm').classList.add('on');
  const cs = ['#6366f1','#ec4899','#fbbf24','#10b981','#06b6d4'];
  for (let i = 0; i < 36; i++) { const c = document.createElement('i'); c.className = 'cf'; c.style.cssText = `left:${Math.random() * 100}vw;background:${cs[i % 5]};animation-delay:${Math.random() * .5}s;animation-duration:${1.3 + Math.random()}s`; document.body.appendChild(c); setTimeout(() => c.remove(), 2800); }
  clearTimeout(done.t); done.t = setTimeout(() => $('#okm').classList.remove('on'), 3200);
}
$('#okb').onclick = () => $('#okm').classList.remove('on');
const busy = (b, on) => b.classList.toggle('ld', on);
const isAdmin = () => S.user.role === 'Admin';
const own = x => x.user === S.user.name;
const scope = a => isAdmin() ? a : a.filter(own);
const sum = (a, f) => a.reduce((s, x) => s + num(f(x)), 0);
function countUp(el, to, money) {
  const t0 = performance.now(); (function f(t) { const k = Math.min(1, (t - t0) / 900), v = Math.round(to * (1 - Math.pow(1 - k, 3)));
    el.textContent = money ? INR(v) : v.toLocaleString('en-IN'); if (k < 1) requestAnimationFrame(f); })(t0);
}
function aggRows() {
  const A = scope(S.alloc), Sa = scope(S.sales), R = [];
  S.cfg.dates.forEach(d => S.cfg.categories.forEach(c => {
    const rec = sum(A.filter(x => x.date === d && x.category === c.category), x => x.received);
    const sold = sum(Sa.filter(x => x.date === d && x.category === c.category), x => x.sold);
    R.push({d, c:c.category, p:num(c.price), rec, sold, stock:rec - sold, amt:sold * num(c.price)});
  }));
  return R;
}
function summaryRows() {
  const Sa = scope(S.sales), cats = S.cfg.categories, pr = {}; cats.forEach(c => pr[c.category] = num(c.price));
  const schools = [...new Set([...(isAdmin() ? [] : [S.user.school]), ...Sa.map(x => x.school)])].filter(Boolean).sort();
  const rows = [];
  schools.forEach(sc => S.cfg.dates.forEach((d, i) => {
    const q = {}; let tot = 0, amt = 0;
    cats.forEach(c => { const n = sum(Sa.filter(x => x.school === sc && x.date === d && x.category === c.category), x => x.sold); q[c.category] = n; tot += n; amt += n * pr[c.category]; });
    rows.push({sc, d, q, tot, amt, first:i === 0, span:S.cfg.dates.length});
  }));
  return rows;
}
function shiftMatrix() {
  const Sa = scope(S.sales), A = scope(S.alloc), SH = S.cfg.shifts;
  return `<div class="tw"><table><thead><tr><th>Category</th>${SH.map(h => `<th>${h}</th>`).join('')}<th>Total</th></tr></thead><tbody>
  ${S.cfg.categories.map(c => { const cell = h => { const so = sum(Sa.filter(x => x.category === c.category && x.shift === h), x => x.sold), re = sum(A.filter(x => x.category === c.category && x.shift === h), x => x.received); return [so, re]; };
    const v = SH.map(cell), ts = v.reduce((a, b) => a + b[0], 0), tr = v.reduce((a, b) => a + b[1], 0);
    return `<tr><td>${chip(c.category)}</td>${v.map(x => `<td class="c-s"><b>${x[0]}</b> <small>/ ${x[1]}</small></td>`).join('')}<td class="c-k"><b>${ts}</b> <small>/ ${tr}</small></td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function lastTs(arr) { return arr.map(x => String(x.timestamp)).sort().pop() || '—'; }
function topSellers() {
  const m = {};
  S.teachers.forEach(t => { const k = t.school + '|' + t.teacher; const o = m[k] ||= {school:t.school, teacher:t.teacher, des:t.designation, sold:0, amt:0}; o.sold += num(t.sold); o.amt += num(t.amount); o.des = t.designation; });
  const best = {}; Object.values(m).forEach(x => { if (!best[x.school] || x.sold > best[x.school].sold) best[x.school] = x; });
  return Object.values(best).sort((a, b) => b.sold - a.sold);
}

/* ---------- login ---------- */
async function boot() {
  $('#demoNote').hidden = !DEMO;
  if (localStorage.theme === 'dark') document.documentElement.dataset.t = 'dark';

  if (sess) { const s = JSON.parse(sess); S.user = s.user; S.pin = s.pin; return enter(); }

  if (!r.ok) { $('#uSel').innerHTML = '<option>Could not load users</option>'; return showErr(r.error); }
  $('#uSel').innerHTML = '<option value="">Select your name</option>' + r.users.map(u => `<option>${u.name}</option>`).join('');

  const name = $('#uSel').value, pin = $('#pin').value.trim();

  T = S.teachers.filter(own).map(t => ({teacher:t.teacher, designation:t.designation, category:t.category, shift:t.shift || '', sold:t.sold}));

  <div class="sbar"><div class="gtt">Total received <b id="gr">0</b></div>${locked ? '<span class="pill">🔒 Read-only</span>' : '<button class="btn" id="sv">💾 Save received</button>'}</div>`;
  const calc = () => { let gr = 0;
    D.forEach((g, i) => { let r = 0, s = 0, k = 0;
      document.querySelectorAll(`#at${i} tbody tr[data-d]`).forEach(tr => { const v = num(tr.querySelector('input').value), so = +tr.dataset.so, st = v - so;
        tr.querySelector('.c-k').textContent = st; tr.querySelector('.c-k').classList.toggle('neg', st < 0); r += v; s += so; k += st; });
      const c = document.querySelector(`#at${i} tr.sub`).children; c[1].textContent = r; c[2].textContent = s; c[3].textContent = k; gr += r; });
    $('#gr').textContent = gr; };
  document.querySelectorAll('.ra').forEach(inp => inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').replace(/^0+(?=\d)/, ''); calc(); });
  calc();
  if (locked) return;
  $('#sv').onclick = async () => {
    const rows = [...document.querySelectorAll('.ra')].map(inp => { const tr = inp.closest('tr'); return {date:tr.dataset.d, category:tr.dataset.c, shift:tr.dataset.s, received:num(inp.value), sold:+tr.dataset.so}; });
    const bad = rows.find(x => x.received < x.sold);
    if (bad) return toast(`${bad.date} ${bad.category} ${bad.shift}: received cannot be less than sold (${bad.sold}).`, false);
    if (!confirm(left === 1 ? 'This is your FINAL update. After saving, received tickets will be locked and cannot be edited. Save now?' : `Save received tickets? You will have ${left - 1} update left afterwards.`)) return;
    wait(true, 'Saving received tickets');
    const r = await api('saveAlloc', {name:S.user.name, pin:S.pin, rows});
    if (!r.ok) { wait(false); return toast(r.error, false); }
    await reload(); wait(false); allocView();
    done('Received tickets saved!', (left - 1 > 0 ? `${left - 1} update left` : 'Now locked (all updates used)') + ' · ' + (r.time || ''));
  };
}

/* ---------- teacher sales entry ---------- */
function teachView() {
  const blank = () => ({teacher:'', designation:'', category:'', shift:'', sold:''});
  if (!T.length) T.push(blank());
  const mine = S.teachers.filter(own), pr = c => num(S.cfg.categories.find(x => x.category === c)?.price);
  const opt = (a, v) => `<option value="">Select</option>` + a.map(x => `<option ${x === v ? 'selected' : ''}>${x}</option>`).join('');
  $('#pane').innerHTML = `<div class="card"><h2>👩‍🏫 Teacher ticket sales</h2>
   <p class="meta">Add one row per teacher, category and shift. Names accept letters and spaces only (auto capital). Teacher sales per category and shift cannot exceed tickets received · Last saved: ${lastTs(mine)}</p>
   <div class="tw"><table id="tt"><thead><tr><th>Name of teacher</th><th>Designation</th><th>Category</th><th>Shift</th><th>Price</th><th>Total sale</th><th>Amount</th><th></th></tr></thead><tbody>
   ${T.map((t, i) => `<tr data-i="${i}"><td class="c-d"><input class="inp nm" value="${t.teacher}" placeholder="TEACHER NAME"></td>
    <td><select class="d">${opt(S.cfg.designations, t.designation)}</select></td>
    <td><select class="c">${opt(S.cfg.categories.map(c => c.category), t.category)}</select></td>
    <td><select class="s">${opt(S.cfg.shifts, t.shift)}</select></td>
    <td class="c-r pc">${t.category ? INR(pr(t.category)) : '—'}</td><td class="c-s"><input class="inp q" inputmode="numeric" maxlength="6" value="${t.sold}" placeholder="0"></td>
    <td class="c-a am">${INR(num(t.sold) * pr(t.category))}</td><td><button class="x" title="Remove row">✕</button></td></tr>`).join('')}
   </tbody></table></div>
   <div class="row"><button class="btn alt" id="ad">＋ Add row</button><button class="btn" id="sv">💾 Save teacher sales</button></div></div>`;
  document.querySelectorAll('#tt tbody tr').forEach(tr => {
    const i = +tr.dataset.i, t = T[i], upd = () => { tr.querySelector('.pc').textContent = t.category ? INR(pr(t.category)) : '—'; tr.querySelector('.am').textContent = INR(num(t.sold) * pr(t.category)); };
    const nm = tr.querySelector('.nm'); nm.oninput = () => { nm.value = nm.value.replace(/[^a-zA-Z ]/g, '').replace(/^\s+/, '').toUpperCase(); t.teacher = nm.value; };
    tr.querySelector('.d').onchange = e => t.designation = e.target.value;
    tr.querySelector('.s').onchange = e => t.shift = e.target.value;
    tr.querySelector('.c').onchange = e => { t.category = e.target.value; upd(); };
    const q = tr.querySelector('.q'); q.oninput = () => { q.value = q.value.replace(/\D/g, ''); t.sold = q.value; upd(); };
    tr.querySelector('.x').onclick = () => { T.splice(i, 1); teachView(); };
  });
  $('#ad').onclick = () => { T.push(blank()); teachView(); scrollTo({top:document.body.scrollHeight, behavior:'smooth'}); };
  $('#sv').onclick = async () => {
    const rows = T.filter(t => t.teacher.trim() || t.sold !== '' || t.designation || t.category || t.shift);
    const bad = rows.find(t => !t.teacher.trim() || !t.designation || !t.category || !t.shift || t.sold === '');
    if (bad) return toast('Complete name, designation, category, shift and sale in every row.', false);
    const recBy = {}, tot = {}; S.alloc.filter(own).forEach(x => { const k = x.category + '|' + x.shift; recBy[k] = (recBy[k] || 0) + num(x.received); });
    rows.forEach(x => { const k = x.category + '|' + x.shift; tot[k] = (tot[k] || 0) + num(x.sold); });
    const over = Object.keys(tot).find(k => tot[k] > (recBy[k] || 0));
    if (over) return toast(`${over.replace('|', ' ')}: teacher sales (${tot[over]}) cannot exceed tickets received (${recBy[over] || 0}).`, false);
    wait(true, 'Saving teacher sales');
    const r = await api('saveTeachers', {name:S.user.name, pin:S.pin, rows});
    if (!r.ok) { wait(false); return toast(r.error, false); }
    await reload(); wait(false); teachView();
    done('Teacher sales saved!', rows.length + ' rows updated in Google Sheet · ' + (r.time || ''));
  };
}

const EXJS = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';

const lib = u => new Promise((res, rej) => { if (lib.c[u]) return res(); const e = document.createElement('script'); e.src = u; e.onload = () => { lib.c[u] = 1; res(); }; e.onerror = () => rej(new Error('Could not load export library. Check internet connection.')); document.head.appendChild(e); });
lib.c = {};
async function logoData() {
  if (logoData.v !== undefined) return logoData.v;
  for (const u of ['logo.png', LOGO_URL]) {
    try {
      const r = await fetch(u, {mode:'cors'}); if (!r.ok) continue;
      const b = await r.blob(); if (!/^image\//.test(b.type)) continue;
      const url = await new Promise(ok => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(b); });
      const ratio = await new Promise(ok => { const i = new Image(); i.onload = () => ok(i.width / i.height || 1); i.onerror = () => ok(1); i.src = url; });
      return logoData.v = {url, fmt:/jpe?g/.test(b.type) ? 'JPEG' : 'PNG', ratio};
    } catch (e) {}
  }
  return logoData.v = null;
}
function teacherList() {
  const m = {};
  scope(S.teachers).forEach(t => { const k = t.school + '|' + t.teacher; const o = m[k] ||= {school:t.school, user:t.user, name:t.teacher, des:t.designation, sold:0}; o.sold += num(t.sold); o.des = t.designation; });
  return Object.values(m).sort((a, b) => b.sold - a.sold || a.name.localeCompare(b.name));

function teacherGroups(L) {

/* ---------- admin: school-wise report (screen + Excel + PDF) ---------- */
const SH_TIME = {'Shift-1':'9:30', 'Shift-2':'11:15', 'Shift-3':'2:30', 'Shift-4':'5:15'};
const shLabel = h => { const t = (S.cfg.shiftTimes && S.cfg.shiftTimes[h]) || SH_TIME[h]; return t ? `${h} (${t})` : h; };
const esc = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const fmtTs = t => t ? `${t.slice(8, 10)}-${t.slice(5, 7)}-${t.slice(0, 4)} ${t.slice(11, 16)}` : '—';
const fmtN = n => num(n).toLocaleString('en-IN');
const TINT = {Silver:'E2E8F0', Gold:'FEF3C7', Platinum:'EDE9FE', Diamond:'CFFAFE'};
function schoolReport() {
  const SH = S.cfg.shifts, CT = S.cfg.categories, M = {};
  (S.users || []).filter(u => u.role !== 'Admin').forEach(u => M[u.name] = u.school);
  [...S.alloc, ...S.sales, ...S.teachers].forEach(x => { if (x.user && !(x.user in M)) M[x.user] = x.school || ''; });
  return Object.keys(M).sort().map(code => {
    const A = S.alloc.filter(x => x.user === code), Sa = S.sales.filter(x => x.user === code);
    const upd = [...Sa.map(x => x.timestamp), ...S.teachers.filter(x => x.user === code).map(x => x.timestamp), ...A.map(x => x.updated)].filter(Boolean).map(String).sort().pop() || '';
    const tot = {sh:SH.map(() => ({r:0, s:0})), tr:0, ts:0, tg:0, ac:0}, rows = [];
    S.cfg.dates.forEach(d => CT.forEach(c => {
      const p = num(c.price), sh = SH.map(h => ({r:sum(A.filter(x => x.date === d && x.category === c.category && x.shift === h), x => x.received), s:sum(Sa.filter(x => x.date === d && x.category === c.category && x.shift === h), x => x.sold)}));
      const tr = sum(sh, x => x.r), ts = sum(sh, x => x.s), row = {d, c:c.category, p, sh, tr, ts, tg:tr * p, ac:ts * p};
      sh.forEach((x, i) => { tot.sh[i].r += x.r; tot.sh[i].s += x.s; }); tot.tr += tr; tot.ts += ts; tot.tg += row.tg; tot.ac += row.ac; rows.push(row);
    }));
    return {code, school:M[code], upd, rows, tot};
  });
}
function grandTot(R) {
  const g = {sh:S.cfg.shifts.map(() => ({r:0, s:0})), tr:0, ts:0, tg:0, ac:0};
  R.forEach(x => { x.tot.sh.forEach((v, i) => { g.sh[i].r += v.r; g.sh[i].s += v.s; }); g.tr += x.tot.tr; g.ts += x.tot.ts; g.tg += x.tot.tg; g.ac += x.tot.ac; });
  return g;
}

     </tbody><tfoot><tr><td colspan="2">TOTAL</td>${g.tot.sh.map(x => `<td>${rs(x.r, x.s)}</td>`).join('')}<td>${rs(g.tot.tr, g.tot.ts)}</td><td>${INR(g.tot.tg)} / ${INR(g.tot.ac)}</td></tr></tfoot></table></div></div>`; }).join('');
  return `<div class="card"><h2>🏫 School-wise report <span class="sp"></span><button class="btn xl" data-x="rxlsx|r" style="padding:8px 14px">📗 Excel</button><button class="btn pdf" data-x="rpdf|r" style="padding:8px 14px">📕 PDF</button></h2>
   <p class="meta">${R.length} schools · Received <b class="rv">${G.tr}</b> / Sale <b class="sv">${G.ts}</b> · Target ${INR(G.tg)} / Achieved ${INR(G.ac)}. Each school shows its last update time.</p>
   <input class="inp" style="text-align:left;margin-bottom:12px" placeholder="🔍 Search school name or code" oninput="document.querySelectorAll('.sc').forEach(c=>c.hidden=!c.dataset.q.includes(this.value.toLowerCase()))">

const hexRgb = h => [0, 2, 4].map(i => parseInt(h.replace('#', '').slice(i, i + 2), 16));

async function exportSchoolXlsx() {

  try {
    await lib(EXJS); const lg = await logoData();

    ws.headerFooter.oddFooter = '&LDAV Ticket Stock Manager&CPage &P of &N&R&D';

    ws.getCell('B2').value = `Tickets Received / Sale by shift · Amount Target / Achieved · ${R.length} schools`; ws.getCell('B2').font = {name:'Arial', size:10, color:{argb:'FF475569'}};

    ['B1', 'B2', 'B3'].forEach(c => ws.getCell(c).alignment = {vertical:'middle', indent:1});

    const thin = {style:'thin', color:{argb:'FFCBD5E1'}}, bd = {top:thin, left:thin, bottom:thin, right:thin};
    const fill = c => ({type:'pattern', pattern:'solid', fgColor:{argb:c}});
    const sty = (c, o = {}) => { c.border = bd; c.alignment = {vertical:'middle', horizontal:o.al || 'center', wrapText:true}; if (o.bg) c.fill = fill(o.bg); c.font = {name:'Arial', size:o.size || 9, bold:!!o.bold, color:{argb:o.color || 'FF1E293B'}}; };
    // header (2 rows)
    const h1 = ['S/N', 'SCHOOL NAME', 'USER (SCHOOL CODE)', 'DATE', 'CATEGORY', ...SH.flatMap(h => [shLabel(h), '']), 'TOTAL', '', 'AMOUNT', ''];
    const h2 = ['', '', '', '', '', ...SH.flatMap(() => ['Received', 'Sale']), 'Received', 'Sale', 'Target', 'Achieved'];
    ws.getRow(5).values = h1; ws.getRow(6).values = h2; ws.getRow(5).height = 30; ws.getRow(6).height = 20;
    for (let c = 1; c <= 5; c++) ws.mergeCells(5, c, 6, c);
    for (let i = 0; i <= SH.length + 1; i++) ws.mergeCells(5, 6 + i * 2, 5, 7 + i * 2);
    const HC = ['FF4338CA', 'FF7C3AED', 'FF4338CA', 'FF7C3AED', 'FF0E7490', 'FFBE185D'];
    for (let c = 1; c <= N; c++) { const bg = c <= 5 ? 'FF312E81' : HC[Math.floor((c - 6) / 2)]; [5, 6].forEach(r => sty(ws.getCell(r, c), {bg, bold:true, color:'FFFFFFFF', size:c <= 5 ? 10 : 9.5})); }
    let r = 7;
    R.forEach((g, gi) => {
      const r0 = r;
      g.rows.forEach((x, k) => {
        const row = ws.getRow(r++); row.height = 20;
        row.values = ['', '', '', x.d, x.c, ...x.sh.flatMap(v => v.r ? [v.r, v.s] : ['', '']), ...(x.tr ? [x.tr, x.ts] : ['', '']), x.tg, x.ac];
        for (let c = 4; c <= N; c++) { const cell = row.getCell(c); let bg = 'FFFFFFFF', bold = false, color;
          if (c === 4) { bg = 'FFE0F2FE'; bold = true; }
          else if (c === 5) { bg = 'FF' + (TINT[x.c] || 'EEF2FF'); bold = true; color = 'FF' + col(x.c).slice(1).toUpperCase(); }
          else if (c < 6 + SH.length * 2) bg = (c - 6) % 2 ? 'FFFEF9C3' : 'FFDCFCE7';
          else if (c < 8 + SH.length * 2) { bg = 'FFEDE9FE'; bold = true; }
          else { bg = c === N ? 'FFD1FAE5' : 'FFFFEDD5'; bold = true; }
          sty(cell, {bg, bold, color}); if (c >= 8 + SH.length * 2) cell.numFmt = '#,##0'; }
      });
      const tr = ws.getRow(r++); tr.height = 22; tr.values = ['', '', '', 'TOTAL', '', ...g.tot.sh.flatMap(v => v.r ? [v.r, v.s] : ['', '']), ...(g.tot.tr ? [g.tot.tr, g.tot.ts] : ['', '']), g.tot.tg, g.tot.ac];
      ws.mergeCells(tr.number, 4, tr.number, 5);
      for (let c = 4; c <= N; c++) { sty(tr.getCell(c), {bg:'FFC7D2FE', bold:true, color:'FF312E81', size:10}); if (c >= 8 + SH.length * 2) tr.getCell(c).numFmt = '#,##0'; }
      for (let c = 1; c <= 3; c++) ws.mergeCells(r0, c, r - 1, c);
      for (let d = 0; d < S.cfg.dates.length; d++) ws.mergeCells(r0 + d * NC, 4, r0 + d * NC + NC - 1, 4);
      sty(ws.getCell(r0, 1), {bg:'FFE0E7FF', bold:true, color:'FF312E81', size:12});
      sty(ws.getCell(r0, 2), {bg:'FFEEF2FF', al:'left'});
      ws.getCell(r0, 2).value = {richText:[{text:(g.school || '—') + '\n', font:{name:'Arial', size:10, bold:true, color:{argb:'FF312E81'}}}, {text:'Updated: ' + fmtTs(g.upd), font:{name:'Arial', size:7, italic:true, color:{argb:'FF64748B'}}}]};
      sty(ws.getCell(r0, 3), {bg:'FFEEF2FF', bold:true, color:'FF312E81', size:10});

    });
    const gt = ws.getRow(r); gt.height = 26; gt.values = ['GRAND TOTAL (ALL SCHOOLS)', '', '', '', '', ...G.sh.flatMap(v => [v.r, v.s]), G.tr, G.ts, G.tg, G.ac];
    ws.mergeCells(r, 1, r, 5);
    for (let c = 1; c <= N; c++) { sty(gt.getCell(c), {bg:'FF312E81', bold:true, color:'FFFFFFFF', size:11, al:c === 1 ? 'right' : 'center'}); if (c >= 8 + SH.length * 2) gt.getCell(c).numFmt = '#,##0'; }
    const name = 'School-wise-Ticket-Report.xlsx';
    dl(new Blob([await wb.xlsx.writeBuffer()], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), name);
    wait(false); done('Excel report exported!', name + (lg ? '' : ' (logo not embedded: add logo.png to your GitHub repo)'));
  } catch (e) { wait(false); toast(e.message || 'Export failed', false); }
}

async function exportSchoolPdf() {
  const R = schoolReport(); if (!R.length) return toast('No school data to export yet.', false);
  wait(true, 'Preparing PDF report');
  try {
    await lib(JSPDF); await lib(ATBL); const lg = await logoData();
    const SH = S.cfg.shifts, CT = S.cfg.categories, NC = CT.length, G = grandTot(R);
    const {jsPDF} = window.jspdf, doc = new jsPDF({unit:'pt', format:'a4', orientation:'landscape'}), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const lh = 46, lw = lg ? Math.min(80, lh * lg.ratio) : 0, tx = 36 + (lg ? lw + 12 : 0), drawn = new Set();
    const header = () => { const p = doc.internal.getCurrentPageInfo().pageNumber; if (drawn.has(p)) return; drawn.add(p);
      if (lg) doc.addImage(lg.url, lg.fmt, 36, 18, lw, lh);
      doc.setFont('helvetica', 'bold').setFontSize(18).setTextColor(49, 46, 129).text('School-wise Ticket Report', tx, 40);
      doc.setFont('helvetica', 'normal').setFontSize(8.5).setTextColor(71, 85, 105).text(`Tickets Received / Sale by shift  ·  Amount Target / Achieved (Rs.)  ·  ${R.length} schools`, tx, 56);
      doc.setFontSize(8).setTextColor(100, 116, 139).text('Generated: ' + stamp(), W - 36, 28, {align:'right'});
      doc.setFillColor(79, 70, 229).rect(36, 70, W - 72, 3, 'F'); doc.setFillColor(236, 72, 153).rect(W - 170, 70, 134, 3, 'F'); };
    const widths = [24, 96, 48, 52, 50, ...SH.flatMap(() => [40, 40]), 40, 40, 48, 48], cs = {}; widths.forEach((w, i) => cs[i] = {cellWidth:w, halign:i === 1 ? 'left' : 'center'});
    const hcol = [[67, 56, 202], [124, 58, 237], [67, 56, 202], [124, 58, 237], [14, 116, 144], [190, 24, 93]];
    const head = [[{content:'S/N', rowSpan:2}, {content:'SCHOOL NAME', rowSpan:2}, {content:'USER\n(CODE)', rowSpan:2}, {content:'DATE', rowSpan:2}, {content:'CATEGORY', rowSpan:2}, ...SH.map(h => ({content:shLabel(h), colSpan:2})), {content:'TOTAL', colSpan:2}, {content:'AMOUNT (Rs.)', colSpan:2}],
      [...SH.flatMap(() => ['Received', 'Sale']), 'Received', 'Sale', 'Target', 'Achieved']];
    const shade = ci => ci < 5 ? null : ci < 5 + SH.length * 2 ? ((ci - 5) % 2 ? [254, 249, 195] : [220, 252, 231]) : ci < 7 + SH.length * 2 ? [237, 233, 254] : ci === widths.length - 1 ? [209, 250, 229] : [255, 237, 213];
    const common = {theme:'grid', margin:{top:88, left:36, right:36, bottom:44}, tableWidth:'wrap', pageBreak:'avoid', rowPageBreak:'avoid', columnStyles:cs, didDrawPage:header,
      styles:{font:'helvetica', fontSize:7, cellPadding:2, lineColor:[203, 213, 225], lineWidth:.4, valign:'middle', halign:'center', textColor:[30, 41, 59], minCellHeight:13},
      headStyles:{textColor:255, fontStyle:'bold', fontSize:7.5, fillColor:[67, 56, 202]}};
    let y = 88, onTop = true;
    R.forEach((g, gi) => {
      const need = (g.rows.length + 1) * 13.5 + (onTop ? 32 : 0) + 6;
      if (!onTop && y + need > H - 44) { doc.addPage(); y = 88; onTop = true; }
      const T = g.rows.length, body = [];
      g.rows.forEach((x, k) => { const row = [];
        if (k === 0) {
          row.push({content:String(gi + 1), rowSpan:T + 1, styles:{fontStyle:'bold', fontSize:9, fillColor:[224, 231, 255], textColor:[49, 46, 129]}});
          row.push({content:g.school || '—', rowSpan:T + 1, upd:fmtTs(g.upd), styles:{fontStyle:'bold', fontSize:8, halign:'left', fillColor:[238, 242, 255], textColor:[49, 46, 129]}});
          row.push({content:g.code, rowSpan:T + 1, styles:{fontStyle:'bold', fillColor:[238, 242, 255], textColor:[49, 46, 129]}}); }
        if (k % NC === 0) row.push({content:x.d, rowSpan:NC, styles:{fontStyle:'bold', fillColor:[224, 242, 254]}});
        row.push({content:x.c, styles:{fontStyle:'bold', textColor:hexRgb(col(x.c)), fillColor:hexRgb(TINT[x.c] || 'EEF2FF')}});
        x.sh.forEach(v => row.push(v.r ? String(v.r) : '', v.r ? String(v.s) : '')); row.push(x.tr ? String(x.tr) : '', x.tr ? String(x.ts) : '', fmtN(x.tg), fmtN(x.ac)); body.push(row); });
      body.push([{content:'TOTAL', colSpan:2, styles:{fontStyle:'bold'}}, ...g.tot.sh.flatMap(v => v.r ? [String(v.r), String(v.s)] : ['', '']), ...(g.tot.tr ? [String(g.tot.tr), String(g.tot.ts)] : ['', '']), fmtN(g.tot.tg), fmtN(g.tot.ac)]);
      doc.autoTable({...common, head, body, startY:y, showHead:onTop ? 'firstPage' : 'never',
        didParseCell:d => {
          if (d.section === 'head') { const c = d.column.index; d.cell.styles.fillColor = c < 5 ? [49, 46, 129] : hcol[Math.floor((c - 5) / 2)]; return; }
          if (d.row.index === T) { d.cell.styles.fillColor = [199, 210, 254]; d.cell.styles.fontStyle = 'bold'; d.cell.styles.textColor = [49, 46, 129]; return; }
          const sh = shade(d.column.index); if (sh) { d.cell.styles.fillColor = sh; if (d.column.index >= 5 + SH.length * 2) d.cell.styles.fontStyle = 'bold'; } },
        didDrawCell:d => { if (d.section === 'body' && d.column.index === 1 && d.cell.raw && d.cell.raw.upd) doc.setFont('helvetica', 'italic').setFontSize(6).setTextColor(100, 116, 139).text('Updated: ' + d.cell.raw.upd, d.cell.x + 3, d.cell.y + d.cell.height - 4); } });
      y = doc.lastAutoTable.finalY + 10; onTop = false;
    });
    if (y + 24 > H - 44) { doc.addPage(); y = 88; }
    doc.autoTable({...common, startY:y, showHead:'never', head, body:[[{content:`GRAND TOTAL (${R.length} SCHOOLS)`, colSpan:5, styles:{halign:'right'}}, ...G.sh.flatMap(v => [String(v.r), String(v.s)]), String(G.tr), String(G.ts), fmtN(G.tg), fmtN(G.ac)]],
      bodyStyles:{fillColor:[49, 46, 129], textColor:255, fontStyle:'bold', fontSize:8}});
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) { doc.setPage(i); header(); doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(100, 116, 139); doc.text('DAV Ticket Stock Manager', 36, H - 22); doc.text(`Page ${i} of ${n}`, W - 36, H - 22, {align:'right'}); }
    const name = 'School-wise-Ticket-Report.pdf'; doc.save(name);
    wait(false); done('PDF report exported!', name + (lg ? '' : ' (logo not embedded: add logo.png to your GitHub repo)'));
  } catch (e) { wait(false); toast(e.message || 'Export failed', false); }
}

/* ---------- admin: tap a school to see its data and graphs ---------- */
let mch = [];
function closeSchool() { mch.forEach(c => c.destroy()); mch = []; $('#sm').classList.remove('on'); document.body.style.overflow = ''; }
function openSchool(code) {
  const g = schoolReport().find(x => x.code === code), card = document.querySelector(`.sc[data-code="${CSS.escape(code)}"]`); if (!g) return;
  const SH = S.cfg.shifts, CT = S.cfg.categories, pct = g.tot.tg ? Math.round(g.tot.ac * 100 / g.tot.tg) : 0, tm = {};
  S.teachers.filter(x => x.user === code).forEach(t => { const o = tm[t.teacher] ||= {name:t.teacher, des:t.designation, sold:0}; o.sold += num(t.sold); o.des = t.designation; });
  const TL = Object.values(tm).sort((a, b) => b.sold - a.sold);
  $('#smb').innerHTML = `
   <div class="mh"><div><h2>🏫 ${esc(g.school || '—')}</h2><small>School code: <b>${esc(g.code)}</b> · Updated: ${fmtTs(g.upd)}</small></div><button class="ib" id="smx">✕</button></div>
   <div class="kpis"><div class="k k1"><small>Received</small><b>${fmtN(g.tot.tr)}</b></div><div class="k k2"><small>Sold</small><b>${fmtN(g.tot.ts)}</b></div>
    <div class="k k3"><small>In stock</small><b>${fmtN(g.tot.tr - g.tot.ts)}</b></div><div class="k k4"><small>Achieved · target ${INR(g.tot.tg)}</small><b>${INR(g.tot.ac)}</b></div></div>
   <div class="card"><h2>🎯 Target achieved <span class="sp"></span><span style="color:var(--p)">${pct}%</span></h2><div class="bar"><div id="mpb"></div></div></div>
   <div class="cg"><div class="card"><h2>📊 Received vs sold by category</h2><div class="cv"><canvas id="m1"></canvas></div></div>
    <div class="card"><h2>🕐 Sold by shift and date</h2><div class="cv"><canvas id="m2"></canvas></div></div></div>
   <div class="card"><h2>📋 Detailed data</h2><p class="meta">Received / Sale by shift · Amount Target / Achieved</p>${card ? card.querySelector('.tw').outerHTML : ''}</div>
   <div class="card"><h2>👩‍🏫 Teachers</h2>${TL.length ? `<div class="tw"><table><thead><tr><th>S/N</th><th>Name</th><th>Designation</th><th>Sold</th></tr></thead><tbody>${TL.map((t, i) => `<tr><td>${i + 1}</td><td style="text-align:left">${esc(t.name)}</td><td>${esc(t.des)}</td><td class="c-s"><b>${t.sold}</b></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No teacher sales recorded for this school.</div>'}</div>`;
  $('#sm').classList.add('on'); document.body.style.overflow = 'hidden'; $('#sm').scrollTop = 0; $('#smx').onclick = closeSchool;
  setTimeout(() => { const p = $('#mpb'); if (p) p.style.width = Math.min(100, pct) + '%'; }, 80);
  if (!window.Chart) return;
  Chart.defaults.font.family = 'Poppins'; Chart.defaults.color = getComputedStyle(document.body).color;
  const dc = ['#6366f1', '#ec4899', '#f59e0b', '#10b981'];
  mch.push(new Chart($('#m1'), {type:'bar', data:{labels:CT.map(c => c.category), datasets:[
    {label:'Received', backgroundColor:'#10b981', borderRadius:6, data:CT.map(c => sum(g.rows.filter(r => r.c === c.category), r => r.tr))},
    {label:'Sold', backgroundColor:'#f97316', borderRadius:6, data:CT.map(c => sum(g.rows.filter(r => r.c === c.category), r => r.ts))}]},
    options:{maintainAspectRatio:false, scales:{y:{beginAtZero:true}}, plugins:{legend:{position:'bottom'}}, animation:{duration:1100}}}));
  mch.push(new Chart($('#m2'), {type:'bar', data:{labels:SH.map(shLabel), datasets:S.cfg.dates.map((d, i) => ({label:d, backgroundColor:dc[i % 4], borderRadius:6, data:SH.map((h, k) => sum(g.rows.filter(r => r.d === d), r => r.sh[k].s))}))},
    options:{maintainAspectRatio:false, scales:{y:{beginAtZero:true}}, plugins:{legend:{position:'bottom'}}, animation:{duration:1300}}}));
}
document.addEventListener('click', e => { const a = e.target.closest('[data-sc]'); if (a) openSchool(a.dataset.sc); });
